buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 29
        compileSdkVersion = 36
        targetSdkVersion = 36
        kotlinVersion = "2.1.20"
        excludeAppGlideModule = true
        androidx_lifecycle_version = "2.8.6"
        playServicesVersion = "18+"
        firebaseMessagingVersion = "21.0.0"
        androidXCore = "1.6.0"
        androidXBrowser = "1.3.0"

        ndkVersion = "27.3.13750724"

        jacksonVersion = "2.17.3"
        okhttpVersion = "4.12.0"
        securityCryptoVersion = "1.1.0"
    }
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://maven.fabric.io/public"
        }
        maven {
            url "https://packages.rnd.mendix.com/jcenter"
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle'
        classpath "com.facebook.react:react-native-gradle-plugin"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.2.10'
        apply from: file("../node_modules/mendix-native/android/mendix.gradle"); applyMendixClassPaths(project)

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}


project.ext {
    set('react-native', [
            versions: [
                // Firebase BOM used by react-native-firebase and android/app/build.gradle (firebaseBomVersion).
                // Keep in sync with sdkVersions.android.firebase of the @react-native-firebase/app version in .mx/known_dependencies.json.
                    firebase: [
                            bom: "33.12.0"
                    ],
            ],
    ])
}

allprojects {
    repositories {
        google()
        mavenCentral()

        maven {
            url "https://maven.fabric.io/public"
        }

        maven {
            url "https://packages.rnd.mendix.com/jcenter"
        }

        // Build all modules with Android 16KB pages enabled
        plugins.withId('com.android.application') {
            android {
                defaultConfig {
                    externalNativeBuild {
                        cmake {
                            arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                        }
                    }
                }
            }
        }

        plugins.withId('com.android.library') {
            android {
                defaultConfig {
                    externalNativeBuild {
                        cmake {
                            arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                        }
                    }
                }
            }
        }
    }
}

// Clean up phase: remove auto-added repositories and re-add JitPack correctly
afterEvaluate { project ->
    def jitpackRemoved = false

    project.repositories.removeAll { repo ->
        def repoUrl = repo.url.toString()

        // Remove deprecated JCenter
        if (repoUrl.contains("jcenter.bintray.com")) {
            return true
        }

        // Remove auto-added JitPack (re-added below)
        if (repoUrl.contains("jitpack.io")) {
            jitpackRemoved = true
            return true
        }

        return false
    }

    if (jitpackRemoved) {
        project.repositories {
            maven {
                url "https://www.jitpack.io"
            }
        }
    }

}

apply plugin: "com.facebook.react.rootproject"
